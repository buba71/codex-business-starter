name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22.22.2'
  DATABASE_URL: 'postgresql://app:!ChangeMe!@127.0.0.1:5432/starter_kit_test?serverVersion=16&charset=utf8'

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: starter_kit_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: '!ChangeMe!'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d starter_kit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ctype, iconv, mbstring, pdo_pgsql, xml
          tools: composer:2
          coverage: none

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ env.PHP_VERSION }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ env.PHP_VERSION }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build frontend assets for functional tests
        run: npm run build

      - name: Run Doctrine migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test
        env:
          APP_ENV: test

      - name: Run PHPUnit
        run: php bin/phpunit
        env:
          APP_ENV: test

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

      - name: Build frontend assets
        run: npm run build

  security:
    name: Security checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:2, symfony-cli:5.22.0
          coverage: none

      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit Composer dependencies
        working-directory: backend
        run: composer audit --locked --no-interaction

      - name: Run Symfony security check
        id: symfony-security-check
        working-directory: backend
        continue-on-error: true
        run: |
          set +e
          symfony check:security
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Symfony Security Check reported findings or could not reach its advisory database; Composer Audit remains the blocking PHP security gate."
          fi
          exit 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: backend
        run: npm ci

      - name: Audit JavaScript dependencies
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  code-quality:
    name: Code quality
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ctype, iconv, mbstring, pdo_pgsql, xml
          tools: composer:2
          coverage: none

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ env.PHP_VERSION }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ env.PHP_VERSION }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Warm Symfony container
        run: php bin/console cache:warmup --env=dev

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse

      - name: Check PHP formatting
        run: vendor/bin/php-cs-fixer check --diff --verbose

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
